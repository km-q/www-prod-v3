<style>
/* Layout: a night sky of ink-wash mountains and drifting particles; content floats above in a 1180px column. One dark world, committed. */
:root{
  --night:#060912;
  --ink:#0d1324;
  --ink-2:#141c33;
  --line:rgba(150,172,226,.16);
  --paper:#ece6d6;
  --mist:#9aa3bf;
  --jade:#3ff0d8;
  --gold:#f0c35a;
  --seal:#c8382f;
  --f-cjk:"Noto Serif TC","Noto Serif JP","Noto Serif KR",serif;
  --f-sans-cjk:"Noto Sans TC","Noto Sans JP","Noto Sans KR";
  --f-disp:"Cormorant Garamond",var(--f-cjk);
  --f-body:"Be Vietnam Pro",var(--f-sans-cjk),system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
:root[lang="ja"]{--f-cjk:"Noto Serif JP","Noto Serif TC",serif;--f-sans-cjk:"Noto Sans JP","Noto Sans TC"}
:root[lang="ko"]{--f-cjk:"Noto Serif KR","Noto Serif TC",serif;--f-sans-cjk:"Noto Sans KR","Noto Sans TC"}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) body{line-height:2.2}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,main,footer{position:relative;z-index:1}
a{color:var(--jade)}
ruby{ruby-position:over}
rt{font-family:var(--f-cjk);font-size:.52em;color:var(--gold);letter-spacing:0;opacity:.92;font-weight:600}
:focus-visible{outline:2px solid var(--jade);outline-offset:3px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Ruby (furigana / hangul / simplified) */
:root[lang="zh-Hant"] rt{font-family:"Noto Serif SC","Noto Sans SC",serif}
:root:is([lang="ja"],[lang="ko"],[lang="zh-Hant"]) h2{line-height:1.9}
:root:is([lang="ja"],[lang="ko"],[lang="zh-Hant"]) .page-head h1{line-height:1.75}
:root:is([lang="ja"],[lang="ko"],[lang="zh-Hant"]) :is(.cn,.pcn,.quote-cn,.quote-tr){line-height:1.9}
:root:is([lang="ja"],[lang="ko"],[lang="zh-Hant"]) :is(.glyph,.vg){line-height:1.5}
:is(.cn,.pcn,.path .num) rt{font-size:.36em}
.quote-cn rt{font-size:.3em;letter-spacing:0}
:is(.glyph,.vg) rt{font-size:.2em;-webkit-text-stroke:0;text-shadow:none}
.vtitle i{font-style:normal;font-family:var(--f-cjk);font-weight:600;font-size:.19em;color:var(--gold);writing-mode:vertical-rl;letter-spacing:.05em;filter:none}
.btn rt{color:inherit;opacity:.75}
/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,9,18,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--paper);margin-right:auto}
.seal{display:grid;grid-template-columns:1fr 1fr;width:40px;height:40px;background:var(--seal);color:#fbeee6;border-radius:3px;font-family:var(--f-cjk);font-weight:900;font-size:16px;line-height:20px;text-align:center;box-shadow:0 0 0 2px rgba(200,56,47,.25),0 0 18px rgba(200,56,47,.35);flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand-txt b{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:21px;letter-spacing:.02em}
.brand-txt span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.32em;color:var(--mist)}
nav.main{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.main a{white-space:nowrap;text-decoration:none;color:var(--mist);font-size:14px;padding:8px 12px;border-radius:3px;line-height:1.5}
nav.main a:hover{color:var(--paper)}
nav.main a[aria-current="page"]{color:var(--jade);background:rgba(63,240,216,.08);box-shadow:inset 0 -2px 0 var(--jade)}
.langsel{position:relative;display:flex;align-items:center;gap:8px}
.langsel select{appearance:none;-webkit-appearance:none;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:3px;padding:8px 28px 8px 12px;font:500 13px var(--f-body);cursor:pointer;field-sizing:content}
.langsel::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);transform:translateY(-70%) rotate(45deg);pointer-events:none}
@media (max-width:760px){
  .top .wrap{gap:10px 12px}
  nav.main{order:3;width:100%;margin-inline:-6px}
  .brand{gap:10px}
  .brand-txt b{font-size:18px}
  .brand-txt span{letter-spacing:.2em}
  .langsel select{padding:7px 26px 7px 10px;font-size:12.5px}
}

/* Type */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
:root:not([lang="en"]) .eyebrow{letter-spacing:.08em;font-family:var(--f-body);font-size:13.5px;font-weight:500}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-disp);font-weight:600;font-size:clamp(30px,4vw,48px);line-height:1.12;letter-spacing:.005em}
:root:not([lang="en"]) h2{font-family:var(--f-cjk);font-weight:600;font-size:clamp(26px,3.4vw,40px);line-height:1.35}
:root[lang="vi"] h2{font-family:"Cormorant Garamond",var(--f-cjk);font-size:clamp(30px,4vw,46px);line-height:1.6}
.lead{font-size:clamp(17px,1.6vw,19px);color:var(--paper);opacity:.9;max-width:60ch}
p{margin:0}
.muted{color:var(--mist)}

/* Sections */
.view{display:block}
.sec{padding-block:clamp(56px,8vw,104px)}
.sec-head{display:grid;gap:14px;max-width:760px;margin-bottom:clamp(28px,4vw,48px)}
.sec-head p{color:var(--mist);max-width:62ch}
.page-head{padding-block:clamp(56px,8vw,96px) clamp(16px,3vw,32px)}
.page-head h1{font-family:var(--f-disp);font-weight:600;font-size:clamp(40px,6vw,78px);line-height:1.05;margin-bottom:18px}
:root:not([lang="en"]) .page-head h1{font-family:var(--f-cjk);font-weight:900;font-size:clamp(34px,5vw,64px);line-height:1.3}
:root[lang="vi"] .page-head h1{font-family:"Cormorant Garamond",var(--f-cjk);font-weight:600;line-height:1.5}
.page-head .lead{color:var(--mist)}

/* Buttons */
.btn{display:inline-block;text-align:center;vertical-align:bottom;font:500 15px var(--f-body);padding:12px 20px;border-radius:3px;border:1px solid var(--jade);color:var(--night);background:var(--jade);text-decoration:none;cursor:pointer;transition:box-shadow .25s,transform .25s;line-height:1.4}
.btn:hover{box-shadow:0 0 24px rgba(63,240,216,.45);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold);box-shadow:none}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.gold:hover{box-shadow:0 0 24px rgba(240,195,90,.45)}
.textlink{font-family:var(--f-body);font-weight:500;color:var(--jade);text-decoration:none;border-bottom:1px solid rgba(63,240,216,.35);padding-bottom:2px}
.textlink:hover{border-color:var(--jade)}

/* Hero */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,.95fr);gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(40px,6vw,88px)}
.vtitle{display:flex;flex-direction:column;gap:.06em;font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(64px,7.5vw,108px);line-height:1;margin:0;filter:drop-shadow(0 0 22px rgba(63,240,216,.28))}
.vc{display:flex;align-items:center;gap:.08em}
.vc b{font-weight:900;color:var(--paper)}
.vc:nth-child(3) b{color:color-mix(in srgb,var(--paper) 45%,var(--jade))}
.vc:nth-child(4) b{color:var(--jade)}
.hero-copy{display:grid;gap:22px;min-width:0}
.hero-copy h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-style:italic;font-size:clamp(44px,5.6vw,80px);line-height:.98;letter-spacing:-.01em}
.hero-copy h1 em{font-style:normal;color:var(--jade);text-shadow:0 0 28px rgba(63,240,216,.45)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.oracle{display:grid;gap:14px;justify-items:center;min-width:0}
.oracle-stage{position:relative;width:100%;max-width:520px;aspect-ratio:1}
.oracle-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.oracle-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.readout{font-family:var(--f-mono);font-size:13px;color:var(--gold);min-height:1.6em;text-align:center}
:root:not([lang="en"]) .readout{font-family:var(--f-body)}
.caption{font-size:13.5px;color:var(--mist);text-align:center;max-width:46ch}
@media (max-width:980px){
  .hero{grid-template-columns:auto minmax(0,1fr)}
  .oracle{grid-column:1/-1}
}
@media (max-width:620px){
  .hero{grid-template-columns:minmax(0,1fr);row-gap:6px}
  .hero-copy{gap:18px}
  .hero-copy h1{order:-1}
  .hero-copy .eyebrow{margin-top:-8px}
  .vtitle{flex-direction:row;font-size:56px;gap:.04em}
  .vc{flex-direction:column-reverse;gap:2px}
  .vtitle i{writing-mode:horizontal-tb;font-size:.24em}
}

/* Realms */
.realms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.realm{display:grid;gap:12px;align-content:start;padding-top:22px;border-top:1px solid var(--line)}
.glyph{font-family:"Noto Serif TC",serif;font-weight:900;font-size:88px;line-height:1;color:transparent;-webkit-text-stroke:1.2px var(--jade);text-shadow:0 0 30px rgba(63,240,216,.22)}
.glyph-rd{font-family:var(--f-cjk);font-weight:600;font-size:18px;line-height:1;color:var(--gold);margin-bottom:-6px}
.realm:nth-child(2) .glyph{-webkit-text-stroke-color:var(--gold);text-shadow:0 0 30px rgba(240,195,90,.2)}
.realm h3{font-size:21px;font-weight:600;line-height:1.4}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .realm h3{line-height:2}
.realm p{color:var(--mist)}
.realm .topics{font-family:var(--f-mono);font-size:12.5px;color:var(--paper);opacity:.8;line-height:1.9}
:root:not([lang="en"]) .realm .topics{font-family:var(--f-body);font-size:13.5px}
@media (max-width:820px){.realms{grid-template-columns:minmax(0,1fr)}}

/* Quote band */
.quote{position:relative;border-block:1px solid var(--line);background:linear-gradient(90deg,rgba(13,19,36,.2),rgba(13,19,36,.85) 30%,rgba(13,19,36,.85) 70%,rgba(13,19,36,.2))}
.quote .wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;padding-block:clamp(40px,6vw,72px)}
.quote-cn{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(30px,4.2vw,54px);line-height:1.25;color:var(--gold);letter-spacing:.08em;text-shadow:0 0 30px rgba(240,195,90,.25);margin:0}
.quote-body{display:grid;gap:10px;min-width:0}
.quote-tr{font-family:"Cormorant Garamond",var(--f-cjk);font-style:italic;font-size:clamp(20px,2.2vw,26px);line-height:1.45}
:root:not([lang="en"]) .quote-tr{font-style:normal;font-family:var(--f-cjk);font-weight:600;font-size:clamp(18px,2vw,22px)}
.quote-src{font-size:13.5px;color:var(--mist)}
@media (max-width:720px){.quote .wrap{grid-template-columns:minmax(0,1fr)}}

/* Cards */
.card{background:rgba(13,19,36,.78);border:1px solid var(--line);border-radius:4px;padding:24px;display:grid;gap:12px;align-content:start;transition:border-color .3s,box-shadow .3s;min-width:0}
.card:hover{border-color:rgba(63,240,216,.45);box-shadow:0 0 0 1px rgba(63,240,216,.12),0 18px 40px -24px rgba(63,240,216,.35)}
.feat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.feat-grid{grid-template-columns:minmax(0,1fr)}}
.cn{font-family:"Noto Serif TC",serif;font-weight:900;font-size:34px;line-height:1.15;letter-spacing:.06em;color:var(--paper)}
.tri-row{display:flex;align-items:center;gap:12px}
.tri-row svg{flex:none}
.tri-meta{font-family:var(--f-mono);font-size:12.5px;color:var(--gold);letter-spacing:.04em}
.sname{font-size:15px;color:var(--jade);font-weight:500}
.card .lesson-p{color:var(--mist)}
.more{margin-top:28px}

/* Path (home) */
.path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:4px;background:rgba(13,19,36,.6)}
.path li{list-style:none;padding:22px;display:grid;gap:6px;border-right:1px solid var(--line);min-width:0}
.path li:last-child{border-right:0}
.path .num{font-family:"Noto Serif TC",serif;font-weight:900;color:var(--gold);font-size:14px}
.path .pcn{font-family:"Noto Serif TC",serif;font-weight:900;font-size:28px;letter-spacing:.06em}
.path .psub{color:var(--mist);font-size:14.5px}
ol.path{margin:0;padding:0}
@media (max-width:900px){.path{grid-template-columns:minmax(0,1fr)}.path li{grid-template-columns:28px 6.5rem minmax(0,1fr);align-items:baseline;column-gap:16px;border-right:0;border-bottom:1px solid var(--line);padding-block:14px}.path li:last-child{border-bottom:0}}

/* Stratagems */
.strat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding-bottom:clamp(56px,8vw,104px)}
@media (max-width:1140px){.strat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.strat-grid{grid-template-columns:minmax(0,1fr)}}
.strat .cn{font-size:32px}
.part{display:grid;gap:4px}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist)}
:root:not([lang="en"]) .lbl{font-family:var(--f-body);letter-spacing:.06em;font-size:12.5px}
.part p{font-size:15px}
.part.lesson{padding:12px 14px;background:rgba(63,240,216,.06);border-left:2px solid var(--jade)}
.part.lesson .lbl{color:var(--jade)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--f-mono);font-size:11.5px;color:var(--gold);border:1px solid rgba(240,195,90,.3);padding:3px 8px;border-radius:2px;line-height:1.5}
:root:not([lang="en"]) .tag{font-family:var(--f-body);font-size:12.5px}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .tag{line-height:2}

/* Programs */
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;position:relative;margin:0;padding:0}
.levels::before{content:"";position:absolute;top:22px;left:22px;right:22px;height:1px;background:linear-gradient(90deg,var(--gold),var(--jade));opacity:.5}
.level{list-style:none;display:grid;gap:12px;align-content:start;position:relative;min-width:0}
.level .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--night);border:1px solid var(--gold);color:var(--gold);font-family:"Noto Serif TC",serif;font-weight:900;font-size:18px;box-shadow:0 0 18px rgba(240,195,90,.3)}
.level .pcn{font-family:"Noto Serif TC",serif;font-weight:900;font-size:30px;letter-spacing:.06em;line-height:1.2}
.level h3{font-size:17px;color:var(--jade);font-weight:500;line-height:1.5}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .level h3{line-height:2}
.level p{color:var(--mist);font-size:15px}
@media (max-width:1060px){.levels{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:36px}.levels::before{display:none}}
@media (max-width:560px){.levels{grid-template-columns:minmax(0,1fr)}}
.labs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:1000px){.labs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.labs{grid-template-columns:minmax(0,1fr)}}
.lab .cn{font-size:26px}
.lab h3{font-size:16px;font-weight:500;color:var(--gold);line-height:1.5}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .lab h3{line-height:2}
.lab p{color:var(--mist);font-size:15px}

/* Qubit demo */
.demo{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(20px,4vw,48px);align-items:center;padding:clamp(20px,3vw,36px);border:1px solid rgba(63,240,216,.3);border-radius:4px;background:radial-gradient(circle at 20% 30%,rgba(63,240,216,.08),transparent 60%),rgba(13,19,36,.85)}
.demo-l{display:grid;gap:14px;justify-items:center}
.demo-l svg{width:100%;max-width:240px;height:auto}
.slider{display:grid;gap:6px;width:100%;max-width:280px}
.slider label{font-size:14px;color:var(--mist);display:flex;justify-content:space-between}
.slider output{font-family:var(--f-mono);color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--jade)}
.demo-r{display:grid;gap:18px;min-width:0}
.demo-r h3{font-family:var(--f-disp);font-size:clamp(24px,2.6vw,32px);font-weight:600;line-height:1.25}
:root:not([lang="en"]) .demo-r h3{font-family:var(--f-cjk);font-size:clamp(20px,2.2vw,26px);line-height:1.5}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .demo-r h3{line-height:2}
.demo-r > p{color:var(--mist)}
.bars{display:grid;gap:14px}
.bar{display:grid;grid-template-columns:52px minmax(0,1fr) 120px;gap:12px;align-items:center}
.bar .k{font-family:var(--f-mono);color:var(--paper);font-size:15px}
.track{position:relative;height:22px;background:rgba(150,172,226,.1);border-radius:2px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,rgba(63,240,216,.5),var(--jade));box-shadow:0 0 14px rgba(63,240,216,.5)}
.bar.one .fill{background:linear-gradient(90deg,rgba(240,195,90,.5),var(--gold));box-shadow:0 0 14px rgba(240,195,90,.45)}
.exp{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--paper)}
.bar .v{font-family:var(--f-mono);font-size:12.5px;color:var(--mist);text-align:right;font-variant-numeric:tabular-nums;line-height:1.4}
.legend{display:flex;gap:18px;font-size:13px;color:var(--mist);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:middle;background:var(--jade)}
.legend i.e{width:2px;height:14px;background:var(--paper)}
@media (max-width:760px){.demo{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:44px minmax(0,1fr);}.bar .v{grid-column:2;text-align:left}}

/* About */
.about-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(28px,5vw,72px);align-items:start;padding-bottom:clamp(40px,6vw,72px)}
.about-text{display:grid;gap:18px;font-size:17px}
.about-text p:last-child{color:var(--gold)}
.values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.value{background:rgba(13,19,36,.92);padding:22px;display:grid;gap:6px;align-content:start;min-width:0}
.value .vg{font-family:"Noto Serif TC",serif;font-weight:900;font-size:40px;line-height:1;color:var(--jade);text-shadow:0 0 18px rgba(63,240,216,.35)}
.value h3{font-size:16px;font-weight:600;line-height:1.5}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .value h3{line-height:2}
.value p{color:var(--mist);font-size:14.5px}
.vals-h{font-size:14px;color:var(--gold);margin-bottom:12px;font-weight:500}
@media (max-width:860px){.about-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.values{grid-template-columns:minmax(0,1fr)}}

.join{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,4vw,56px);padding:clamp(22px,4vw,44px);border:1px solid var(--line);border-radius:4px;background:rgba(13,19,36,.85);margin-bottom:clamp(56px,8vw,104px)}
.join .sec-head{margin:0}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:grid;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13.5px;color:var(--mist)}
.field input,.field select{width:100%;background:var(--night);color:var(--paper);border:1px solid var(--line);border-radius:3px;padding:11px 12px;font:400 15px var(--f-body)}
.field input:focus,.field select:focus{border-color:var(--jade);outline:none;box-shadow:0 0 0 3px rgba(63,240,216,.15)}
.form-foot{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.form-note{font-size:13px;color:var(--mist)}
.thanks{grid-column:1/-1;color:var(--jade);font-size:15px}
@media (max-width:820px){.join{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){form{grid-template-columns:minmax(0,1fr)}}

/* Footer */
footer{border-top:1px solid var(--line);background:rgba(6,9,18,.86)}
footer .wrap{display:flex;gap:18px;align-items:center;padding-block:28px;flex-wrap:wrap}
footer p{color:var(--mist);font-size:14px;flex:1 1 300px}
footer .copy{font-family:var(--f-mono);font-size:12px;color:var(--mist);flex:none}

/* Lesson pages */
.strat .open{margin-top:6px;justify-self:start}
.ls-top{padding-block:28px 0}
.ls-hero{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);gap:clamp(20px,4vw,48px);align-items:center;padding-block:18px clamp(24px,4vw,44px)}
.ls-title{display:grid;gap:14px;min-width:0}
.ls-title .eyebrow{margin:0}
.ls-cn{font-size:clamp(50px,6vw,84px);line-height:1.15}
:root:is([lang="ja"],[lang="ko"],[lang="zh-Hant"]) .ls-cn{line-height:1.6}
.ls-sub{font-size:19px;color:var(--jade);font-weight:500;line-height:1.5}
.ls-sub .muted{font-weight:400;font-size:15px}
.ls-lead{color:var(--mist)}
.scene{margin:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--night);box-shadow:0 30px 80px -40px rgba(63,240,216,.4)}
.scene svg{display:block;width:100%;height:auto}
@media (max-width:920px){.ls-hero{grid-template-columns:minmax(0,1fr)}}
.ls-note{border:1px dashed rgba(240,195,90,.45);color:var(--gold);padding:10px 14px;border-radius:3px;font-size:14px}
.ls-sec{padding-block:clamp(26px,4vw,48px);display:grid;gap:22px;align-content:start}
.ls-story{grid-template-columns:minmax(0,1.45fr) minmax(0,.75fr);gap:clamp(24px,4vw,56px);align-items:start}
.ls-main{display:grid;gap:16px;max-width:66ch;min-width:0}
.ls-main p{font-size:17px}
.ls-main h2+p::first-letter{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:3.3em;float:left;line-height:.8;margin:6px 10px 0 0;color:var(--gold)}
.ls-aside{display:grid;gap:10px;padding:20px;border-left:2px solid var(--gold);background:rgba(240,195,90,.05);min-width:0}
.ls-ch{font-family:var(--f-disp);font-size:28px;font-weight:600;line-height:1.2}
@media (max-width:860px){.ls-story{grid-template-columns:minmax(0,1fr)}}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.steps li{display:grid;gap:8px;align-content:start;padding-top:16px;border-top:1px solid var(--line);min-width:0}
.steps li:first-child{border-top-color:var(--jade)}
.sn{font-family:var(--f-mono);color:var(--gold);font-size:13px;letter-spacing:.1em}
.steps h3{font-size:17px;font-weight:600;line-height:1.4}
.steps p{color:var(--mist);font-size:15px}
@media (max-width:1000px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:minmax(0,1fr)}}
.demo-box{border:1px solid rgba(63,240,216,.3);border-radius:4px;background:radial-gradient(circle at 12% 0%,rgba(63,240,216,.08),transparent 55%),rgba(13,19,36,.9);padding:clamp(18px,3vw,32px);display:grid;gap:20px;min-width:0}
.demo-head{display:grid;gap:6px;max-width:72ch}
.demo-head h3{font-family:var(--f-disp);font-size:clamp(22px,2.4vw,30px);font-weight:600;line-height:1.25}
.demo-head p{color:var(--mist)}
#lsDemo{display:grid;gap:18px;min-width:0}
.dctl{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.dctl label{font-size:14px;color:var(--mist)}
.dctl output{font-family:var(--f-mono);color:var(--gold);min-width:2ch}
.dctl input[type=range]{width:220px;max-width:100%}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer;color:var(--paper)!important}
.chk input{accent-color:var(--jade);width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:3px;padding:14px 16px;display:grid;gap:4px;align-content:start;background:rgba(6,9,18,.6);min-width:0}
.tile b{font-family:var(--f-mono);font-size:22px;font-weight:500;color:var(--paper);font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.tile span{font-size:13px;color:var(--mist);line-height:1.45}
.tile.good b{color:var(--jade)}.tile.warn b{color:var(--gold)}.tile.bad b{color:#ff7d70}
.dmsg{font-size:15px;min-height:1.7em}
.dnote{font-size:13px;color:var(--mist)}
.fleet{display:flex;flex-wrap:wrap;gap:10px}
.boat{display:grid;justify-items:center;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;min-width:92px;line-height:1.5}
.boat.real{border-color:rgba(240,195,90,.65);background:rgba(240,195,90,.05)}
.bl{font-size:12px;color:var(--mist)}.bc{font-family:var(--f-mono);font-size:13px}
.gates{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}

.gate:hover{border-color:var(--jade)}
.gc{font-family:"Noto Serif TC",serif;font-weight:900;font-size:26px;line-height:1.4}

.gl{font-family:var(--f-mono);font-size:11px;color:var(--mist)}

.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:3px;overflow:hidden}

.dcanvas{display:block;width:100%;border:1px solid var(--line);border-radius:3px;background:rgba(6,9,18,.75);cursor:crosshair}

.lb-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--jade),var(--gold) 55%,var(--seal));border-radius:2px;transition:width .2s}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:3px}

}

/* ===== Additions for the advisory, co-op and hub, written in the same idiom ===== */
[hidden]:not([hidden=until-found i]){display:none!important}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
main:focus{outline:none}
.skip{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:60;padding:10px 16px;background:var(--jade);color:var(--night);font:500 14px var(--f-body);border-radius:3px;text-decoration:none;transform:translateY(-200%);transition:transform .25s}
.skip:focus{transform:none}
.sec.tight{padding-top:clamp(16px,3vw,32px)}
.sec.flush{padding-top:0}
.chev{display:inline-block;width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-25%) rotate(45deg);transition:transform .25s}

/* Header submenus */
@media (min-width:761px){nav.main{overflow:visible}}
.dd{position:relative;display:flex;align-items:flex-end}
nav.main .dd>a{padding-right:4px}
.dd-t{appearance:none;border:0;background:transparent;color:var(--gold);width:22px;height:37px;padding:0;display:grid;place-items:center;border-radius:3px;cursor:pointer}
.dd-t:hover{color:var(--paper)}
.dd-t[aria-expanded="true"] .chev{transform:translateY(25%) rotate(-135deg)}
.dd-m{position:absolute;top:calc(100% + 13px);left:0;z-index:30;min-width:220px;display:grid;gap:2px;padding:6px;background:rgba(6,9,18,.97);border:1px solid var(--line);border-radius:4px;box-shadow:0 0 0 1px rgba(63,240,216,.06),0 22px 44px -20px rgba(0,0,0,.85);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s}
.dd-m::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px}
.dd-m.open{opacity:1;transform:none}
nav.main .dd-m a{display:block;color:var(--paper);border-radius:3px}
nav.main .dd-m a:hover{background:rgba(63,240,216,.08);color:var(--jade)}
nav.main .dd-m a[aria-current]{color:var(--jade)}
@media (max-width:760px){.dd-t,.dd-m{display:none!important}}

/* Home: three paths */
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.door{display:grid;gap:12px;align-content:start;padding-top:22px;border-top:1px solid var(--line)}
.door:nth-child(2) .glyph,.region:nth-child(2) .glyph,.tcard:nth-child(2) .glyph,.tier:nth-child(2) .tier-h .glyph{-webkit-text-stroke-color:var(--gold);text-shadow:0 0 30px rgba(240,195,90,.2)}
.door:nth-child(3) .glyph,.region:nth-child(3) .glyph,.tcard:nth-child(3) .glyph,.tier:nth-child(3) .tier-h .glyph{-webkit-text-stroke-color:#e0675d;text-shadow:0 0 30px rgba(200,56,47,.25)}
.door .aud{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
:root:not([lang="en"]) .door .aud{font-family:var(--f-body);letter-spacing:.06em;font-size:13.5px;text-transform:none}
.door h3{font-size:21px;font-weight:600;line-height:1.4}
.door p{color:var(--mist)}
.door .btn{justify-self:start;margin-top:6px}

@media (max-width:820px){.doors{grid-template-columns:minmax(0,1fr)}}

/* Advisory hero */
.hero.adv{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}

.cta-note{font-size:13.5px;color:var(--mist);align-self:center}
.proof{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;padding-top:18px;border-top:1px solid var(--line);max-width:62ch}

.src a:hover{color:var(--jade);border-color:var(--jade)}
@media (max-width:980px){.hero.adv{grid-template-columns:minmax(0,1fr)}}

/* Sample deliverable */

.doc-h{display:flex;align-items:center;gap:14px;padding:18px 20px}
.doc-g{font-family:"Noto Serif TC",serif;font-weight:900;font-size:28px;letter-spacing:.06em;line-height:1.2}
.doc-g rt{font-size:.36em}
.doc-tt{display:grid;min-width:0;flex:1}
.doc-t{font-family:var(--f-disp);font-size:21px;font-weight:600;line-height:1.2}
.doc-s{font-size:12.5px;color:var(--mist)}
.doc .seal{transform:rotate(-4deg)}
.doc-sec{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:10px}
.doc-lbl{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}

.qtrack{position:relative;height:10px;background:rgba(150,172,226,.1);border-radius:2px;overflow:hidden}

.qv{font-family:var(--f-mono);font-size:12px;color:var(--mist);text-align:right;font-variant-numeric:tabular-nums}

.inv-wrap{overflow-x:auto;margin-inline:-20px;padding-inline:20px}

.doc-f{padding:12px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mist);background:rgba(6,9,18,.5)}

.regions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

.tl{margin-top:clamp(40px,6vw,72px)}

.slip.now{border-color:rgba(63,240,216,.45);box-shadow:0 0 26px -10px rgba(63,240,216,.5)}
.slip-y{font-family:var(--f-disp);font-size:34px;line-height:1;font-weight:600;color:var(--paper)}
.slip.now .slip-y{color:var(--jade);text-shadow:0 0 20px rgba(63,240,216,.4)}
.slip ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.slip li{display:grid;gap:4px;font-size:14px;line-height:1.5;color:var(--paper)}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .slip li{line-height:1.9}
.rtags{display:flex;gap:4px;flex-wrap:wrap}
.rtag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--mist);padding:1px 6px;border:1px solid var(--line);border-radius:2px;line-height:1.5}
:root:not([lang="en"]) .rtag{font-family:var(--f-body);font-size:12px}
.rtag.hk{color:var(--jade);border-color:rgba(63,240,216,.4)}
.rtag.sg,.rtag.t2{color:var(--gold);border-color:rgba(240,195,90,.4)}

.tl-note{margin-top:10px;font-size:13px;color:var(--mist)}
.tl-foot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:14.5px;color:var(--mist)}

/* Jurisdiction map */
.tiers{display:grid;gap:18px}
.tier{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2.2fr);gap:clamp(20px,3vw,40px);padding:clamp(20px,3vw,32px);background:rgba(13,19,36,.7);border:1px solid var(--line);border-radius:4px}
.tier-h{display:grid;gap:12px;align-content:start}

.jur-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}

:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .jur h4{line-height:2}
.jur .code{flex:none;font-family:var(--f-mono);font-size:11.5px;color:var(--gold);border:1px solid rgba(240,195,90,.3);padding:1px 7px;border-radius:2px;line-height:1.5}

@media (max-width:640px){.jur-grid,.tier.compact .jur-grid{grid-template-columns:minmax(0,1fr)}}

/* Services (the five stratagems) */

/* Glyph cards (academy, co-op, about) */

.tcard:hover{border-color:rgba(63,240,216,.45);box-shadow:0 0 0 1px rgba(63,240,216,.12),0 18px 40px -24px rgba(63,240,216,.35);transform:translateY(-1px)}

@media (max-width:820px){.talent{grid-template-columns:minmax(0,1fr)}}

/* FAQ */
.faq-wrap{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(24px,4vw,56px);align-items:start}
.faq{display:grid;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:rgba(13,19,36,.78)}
.faq details+details{border-top:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 14px;gap:16px;align-items:center;padding:18px 22px;font-weight:500;line-height:1.5}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{color:var(--jade)}
.faq summary .chev{color:var(--gold)}
.faq details[open] summary .chev{transform:translateY(25%) rotate(-135deg)}
.faq .a{padding:0 22px 20px;color:var(--mist);max-width:72ch;font-size:15px}
@media (max-width:900px){.faq-wrap{grid-template-columns:minmax(0,1fr);gap:0}}

/* Booking, co-op and contact forms */
.book{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,4vw,56px);padding:clamp(22px,4vw,44px);border:1px solid rgba(63,240,216,.3);border-radius:4px;background:radial-gradient(circle at 12% 0%,rgba(63,240,216,.08),transparent 55%),rgba(13,19,36,.88);margin-bottom:clamp(56px,8vw,104px)}
.book .sec-head,.join .sec-head{margin:0;align-content:start}
.field label .req{color:var(--gold)}
.field textarea{width:100%;background:var(--night);color:var(--paper);border:1px solid var(--line);border-radius:3px;padding:11px 12px;font:400 15px/1.6 var(--f-body);resize:vertical;min-height:120px}
.field textarea:focus{border-color:var(--jade);outline:none;box-shadow:0 0 0 3px rgba(63,240,216,.15)}
.field.bad input,.field.bad textarea{border-color:#ff7d70}
.ferr{font-size:12.5px;color:#ff7d70}
.field optgroup{color:var(--gold)}
.field option{color:var(--paper)}
@media (max-width:820px){.book{grid-template-columns:minmax(0,1fr)}}

/* Co-op */
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.tracks .svc .cn{font-size:36px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,5vw,72px)}
.two>div{display:grid;gap:20px;align-content:start}
@media (max-width:900px){.tracks{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}

/* Legal, 404, footer links */
.legal{display:grid;gap:16px;max-width:68ch;padding-bottom:clamp(56px,8vw,104px)}
.legal p{color:var(--mist)}
.lost{display:grid;justify-items:start;gap:20px;padding-block:clamp(56px,8vw,104px);max-width:680px}
.lost .glyph{font-size:128px}
.lost h1{font-family:var(--f-disp);font-weight:600;font-style:italic;font-size:clamp(36px,5vw,60px);line-height:1.05}
:root:not([lang="en"]):not([lang="vi"]) .lost h1{font-family:var(--f-cjk);font-style:normal;font-weight:900;line-height:1.4}
.lost p{color:var(--mist);font-size:17px}
.flinks{display:flex;gap:16px;flex-wrap:wrap}
.flinks a{font-size:14px;color:var(--paper);text-decoration:none;border-bottom:1px solid var(--line)}
.flinks a:hover{color:var(--jade);border-color:var(--jade)}

@media (prefers-reduced-motion:reduce){
  .dd-m,.qfill,.tcard,.region,.svc,.skip,.chev{transition:none}
}

ucture ordinance", "f": ["The HKMA’s first Quantum Preparedness Index put the banking sector at 2.3 out of 10, scored on awareness, planning, pilots and practical preparedness.", "Around half of the banks surveyed had no formal post-quantum plan. The HKMA is aiming for a sector score of 10 by 2030.", "The PQC Toolkit, built with HKUST and launched in November 2026, covers governance, cryptographic inventory, prioritisation and vendor engagement.", "The Protection of Critical Infrastructures (Computer Systems) Ordinance has been in force since 1 January 2026."], "s": [["HKMA, July 2026", "https://www.hkma.gov.hk/eng/news-and-media/press-releases/2026/07/20260727-3/"], ["HKMA, November 2026", "https://www.hkma.gov.hk/eng/news-and-media/press-releases/2026/11/20261102-6/"]]}, {"t": "Singapore", "who": "MAS · CSA", "f": ["CSA expects critical information infrastructure (CII) owners to finish quantum-safe migration by 2031, and encourages other exposed organisations to finish by 2035.", "MAS has consulted on a circular: migration plans by the end of 2027, critical systems by the end of 2030, and all remaining systems by the end of 2034. The consultation closed on 23 November 2026, and the dates may change.", "CSA’s Quantum-Safe Kickstarter Grant gives seed funding for pilots, with priority for CII owners."], "s": [["CSA, October 2026", "https://www.csa.gov.sg/alerts-and-advisories/advisories/advisory-on-quantum-safe-migration-for-organisations/"], ["MAS consultation P019-2026", "https://www.mas.gov.sg/publications/consultations/2026/consultation-paper-on-quantum-safe-migration-guidance-and-timelines-for-the-financial-sector"]]}, {"t": "Macao", "who": "Cybersecurity Law 13/2019", "f": ["No quantum migration timeline has been published yet.", "Banks, insurers, casinos, utilities and telecoms operators are critical infrastructure under the Cybersecurity Law, Law 13/2019.", "Technical specifications for vulnerability management took effect on 1 January 2026.", "Groups with entities in Hong Kong or Singapore will meet those deadlines first. One inventory can serve all three cities."], "s": []}], "tl.h": "The dates on the table", "tl.note": "MAS dates are proposals from Consultation Paper P019-2026. HKMA and CSA dates are published targets.", "tl.mosca": "How long must your data stay secret? Work it out with Mosca’s inequality.", "tl.mlink": "Open the Longzhong lesson", "rtag": {"hk": "HK", "sg": "SG", "mo": "MO", "pr": "Proposed", "now": "Now"}, "slips": [["2026", [["hk", "HKMA publishes the first sector score: 2.3 of 10"], ["hk", "PQC Toolkit launched with HKUST"], ["hk", "Critical infrastructure ordinance in force"], ["mo", "Vulnerability management specifications in force"]]], ["2027", [["sg", "MAS: migration plans due by 31 December. CII owners, DSIBs and NETS submit by 30 June", 1]]], ["2029", [["sg", "MAS: CII systems migrated by 31 December", 1]]], ["2030", [["hk", "HKMA target: a sector score of 10"], ["sg", "MAS: critical systems migrated", 1]]], ["2031", [["sg", "CSA: CII owners complete migration"]]], ["2034", [["sg", "MAS: all remaining systems migrated", 1]]], ["2035", [["sg", "CSA: other exposed organisations encouraged to finish"]]]], "tagline": "Kongming read the wind before the battle at Red Cliffs. We read your cryptography before the quantum one.", "s.h": "Five stratagems for the quantum transition", "s.p": "Each service takes its name from a plan Kongming made, and each one links to the Academy lesson that explains the idea behind it.", "s.idea": "The idea behind it", "services": [{"t": "Longzhong Assessment", "b": "Know where you stand in six weeks", "d": "A fixed-fee assessment that ends in a migration plan your board can approve.", "i": ["Cryptographic inventory across applications, PKI, HSMs, VPNs and vendors", "Scores mapped to the HKMA Quantum Preparedness Index or CSA’s Quantum Readiness Index", "Systems ranked by how long their data must stay secret", "A board paper and a quarter-by-quarter roadmap"]}, {"t": you work outside Hong Kong, Singapore and Macao?", "Yes. We serve clients across the wider Sinosphere, North America and Europe, usually remotely with travel as needed. Every plan follows the rules of each regulator you answer to, and a group that answers to several gets one inventory with a branch for each."], ["Do we have to replace all our cryptography at once?", "No. Migration runs in phases, starting with internet-facing systems and data with long retention. Many systems first run classical and post-quantum algorithms side by side, in hybrid mode."], ["Which algorithms do you migrate to?", "The NIST standards published in 2024: ML-KEM (FIPS 203) for key establishment, and ML-DSA (FIPS 204) and SLH-DSA (FIPS 205) for signatures, adjusted for your regulator’s recommendations."], ["Will co-op members see our data?", "Only with your written approval. Co-op members sign the same NDA as staff, work under a named senior consultant, and never touch production systems unless your team grants access for a defined task."], ["What does the Longzhong Assessment cost?", "A fixed fee, quoted in writing after the free briefing and before any work starts. It depends on how many business units and systems are in scope."], ["Do we need quantum key distribution?", "Usually not. Post-quantum cryptography runs on the networks and hardware you already have, and that is where regulators are focused. We look at QKD only where a specific link needs it."]], "b.h": "Start with one conversation", "b.p": "In 45 minutes you will know which regulator timeline applies to you and which three systems to look at first.", "rr": ["Free, with no obligation", "NDA signed before any discovery", "Fixed fee agreed before work starts"], "f.name": "Name", "f.email": "Work email", "f.org": "Organisation", "f.city": "City", "f.sector": "Sector", "f.driver": "What prompted this", "f.lang": "Preferred language", "f.note": "We will confirm by email.", "f.sending": "Sending", "f.done": "Thank you, {name}. We have received your submission and sent a confirmation to your email.", "err.req": "Enter your {field}.", "err.email": "Enter an email address like name@bank.com.", "cities": ["Hong Kong", "Singapore", "Macao", "Elsewhere"], "sectors": ["Bank or insurer", "Payments or stored value", "Critical infrastructure", "Casino and hospitality", "Government or public body", "Other"], "drivers": ["HKMA Quantum Preparedness Index", "MAS or CSA timelines", "Board or audit question", "A vendor or client asked", "Other"], "c.h1": "Co-op with Kongming Quantum", "c.p": "Paid work terms on real quantum safety and security engagements, for people ready to start a career in quantum computing, cryptography or cybersecurity.", "c.tracks": "Three tracks", "tracks": [{"g": "八陣", "t": "Cryptography engineering", "d": "Build inventory tooling, run hybrid ML-KEM pilots and test performance on client systems.", "k": "Python · TLS · PKI · HSMs"}, {"g": "七擒", "t": "Security testing", "d": "Join penetration tests and red-team exercises, write findings and run retests.", "k": "Web · Cloud · Reporting"}, {"g": "觀星", "t": "Quantum research", "d": "Benchmark algorithms, track regulator guidance and turn what you learn into Academy lessons.", "k": "Qiskit · Papers · Writing"}], "c.elig": "Who can apply", "elig": ["Completed the Academy’s Red Cliffs level, or equivalent coursework or experience", "Passed a short practical exercise in your track", "Eligible to work where the engagement runs: Hong Kong, Singapore, Macao or remote"], "c.safe": "Safeguards for clients and members", "safe": ["Every member signs the same NDA as staff", "No production access without the client’s written approval", "A named senior consultant reviews all work before it reaches a client", "Members are credited for their work where the client agrees"], "c.how": "How a term works", "csteps": [["Apply", "Tell us your track and your Academy level. We reply within ten working days."], ["Practical", "A take-home exercise of about four hours, set by the track lead."], ["Match", "We pair you with an engagement and a named senior consultant."], ["Term", "Sixteen weeks of paid work, ending with a capstone report you present to the team."]], "c.apply": "Apply for the next term", "c.applyp": "Tell us which track you want and your Academy level. We will send the practical exercise for that track.", "c.kbi": "KBI member ID, if you have one", "c.track": "Track", "c.level": "Highest Academy level completed", "c.btn": "Apply for the co-op", "c.note": "We will confirm by email.", "c.done": "Thank you, {name}. We have received your submission and sent a confirmation to your email.", "about.p0": "Kongming Quantum started as an academy. It is now also an advisory firm that helps organisations in Hong Kong, Singapore and Macao move to post-quantum cryptography, with the Academy training the people who do that work.", "pv.h": "Privacy", "pv": ["When you send one of our forms, we receive what you enter: your name and email address and, depending on the form, your organisation, topic and message. Forms are delivered to Kongming Quantum through a Google Apps Script service, so Google processes them on our behalf.", "We use these details to reply to you, to send you a confirmation email, and to handle your booking, application or enquiry.", "To see what we hold about you, or to ask us to correct or delete it, write to us through the contact form.", "We remember your language choice in your browser’s local storage, so the site opens in the same language next time. You can clear it in your browser settings at any time.", "Fonts load from Google Fonts, which receives your IP address when they load. We set no cookies and use no analytics or advertising tools."], "tm.h": "Terms", "tm": ["Everything on this site is general information, not legal or regulatory advice. Regulatory dates are summarised from public sources and may change, so check the regulator’s own publications before you rely on them.", "The Academy’s lessons and demos are for learning. The simulations are simplified models, not measurements of real systems.", "Engagements are governed by a signed statement of work, not by this site."], "nf.h": "This path leads into the stone maze", "nf.p": "Like Lu Xun at Fish Belly Shore, you have walked into a formation with no exit. The page you asked for does not exist.", "nf.btn": "Leave by the Gate of Life", "foot.p": "Post-quantum cryptography and cybersecurity advisory with an academy that teaches through the eyes of Kongming."});
Object.assign(I.zh,{"nav.adv": "顧問服務", "nav.acad": "學院", "nav.coop": "實習計劃", "nav.about": "關於我們", "nav.book": "預約簡報", "menu.open": "開啟選單", "menu.close": "關閉選單", "skip": "跳至內容", "acad.h1": "諸葛量子學院", "a.h1": ["你的量子遷移計劃，", "六星期內呈交董事會"], "a.sub": "諸葛量子是一家後量子密碼學（PQC）及網絡安全顧問公司，服務香港、新加坡及澳門的銀行、保險公司與關鍵基礎設施。我們找出你所依賴的每一把金鑰與每一張憑證，按監管機構的準備度指數為你評分，並交付一份董事會可簽署的遷移計劃。", "a.cta": "預約準備度簡報", "a.cta.note": "免費，45 分鐘，受保密協議保障。", "a.proof": "金管局，2026 年 7 月：香港銀行業在首個量子準備度指數中得 2.3 分（滿分 10 分），目標是 2030 年前達到 10 分。", "a.proof.src": "閱讀金管局新聞稿", "doc.t": "隆中對", "doc.s": "樣本摘錄 · 香港一家區域銀行", "doc.qpi": "量子準備度指數（按範疇）", "doc.w0": "第 0 週", "doc.w6": "第 6 週", "doc.inv": "密碼資產清單，212 項中的首 4 項", "doc.foot": "示意數字。你的計劃會以貴機構自身的系統與評分編製。", "dims": ["認知", "規劃", "試行", "實務準備"], "invHead": ["系統", "演算法", "風險", "遷移期限"], "invRows": [["SWIFT 閘道", "RSA 2048", "高", "2027 年第三季"], ["流動銀行 TLS", "ECDHE、RSA 2048", "高", "2027 年第四季"], ["貸款檔案（保存 12 年）", "RSA 2048 金鑰封裝", "先收集後解密", "即時"], ["程式碼簽署", "RSA 3072", "中", "2029 年第二季"]], "r.h": "三座城市，三個時間表", "r.p": "香港與新加坡都已為量子過渡定下日期。澳門暫未訂立，但當地的關鍵基礎設施營運者已受網絡安全法規管，而且不少隸屬於在另外兩地經營的集團。", "src": "資料來源", "regions": [{"t": "香港", "who": "金管局 · 關鍵基礎設施條例", "f": ["金管局首個量子準備度指數評定銀行業為 2.3 分（滿分 10 分），評估範疇包括認知、規劃、試行及實務準備。", "約半數受訪銀行尚未制定正式的後量子計劃。金管局目標是 2030 年前整體達到 10 分。", "金管局與科大於 2026 年 11 月推出的後量子密碼學工具包，涵蓋管治、密碼資產盤點、優先次序及與供應商溝通。", "《保護關鍵基礎設施（電腦系統）條例》自 2026 年 1 月 1 日起生效。"], "s": [["金管局，2026 年 7 月", "https://www.hkma.gov.hk/eng/news-and-media/press-releases/2026/07/20260727-3/"], ["金管局，2026 年 11 月", "https://www.hkma.gov.hk/eng/news-and-media/press-releases/2026/11/20261102-6/"]]}, {"t": "新加坡", "who": "金融管理局 · 網絡安全局", "f": ["新加坡網絡安全局（CSA）要求關鍵資訊基礎設施擁有者於 2031 年前完成量子安全遷移，並鼓勵其他受影響機構於 2035 年前完成。", "新加坡金融管理局（MAS）就一份通告進行諮詢：2027 年底前制定遷移計劃，2030 年底前完成關鍵系統遷移，2034 年底前完成所有其餘系統。諮詢已於 2026 年 11 月 23 日結束，日期或會調整。", "CSA 的量子安全啟動資助為試點提供種子資金，並優先照顧關鍵資訊基礎設施擁有者。"], "s": [["CSA，2026 年 10 月", "https://www.csa.gov.sg/alerts-and-advisories/advisories/advisory-on-quantum-safe-migration-for-organisations/"], ["MAS 諮詢文件 P019-2026", "https://www.mas.gov.sg/publications/consultations/2026/consultation-paper-on-quantum-safe-migration-guidance-and-timelines-for-the-financial-sector"]]}, {"t": "澳門", "who": "第 13/2019 號法律《網絡安全法》", "f": ["目前尚未公布量子遷移時間表。", "根據第 13/2019 號法律《網絡安全法》，銀行、保險公司、博彩企業、公用事業及電訊營運者均屬關鍵基礎設施。", "《網絡安全漏洞管理技術規範》自 2026 年 1 月 1 日起生效。", "在香港或新加坡設有實體的集團，會先面對當地的期限。一次盤點，可同時應付三地。"], "s": []}], "tl.h": "已公布的時限", "tl.note": "MAS 日期為諮詢文件 P019-2026 的建議。金管局及 CSA 的日期為已公布目標。", "tl.mosca": "你的資料需要保密多久？用 Mosca 不等式算一算。", "tl.mlink": "進入隆中對一課", "rtag": {"hk": "港", "sg": "星", "mo": "澳", "pr": "建議", "now": "今年"}, "slips": [["2026", [["hk", "金管局公布首個業界評分：2.3 分"], ["hk", "與科大推出後量子密碼學工具包"], ["hk", "關鍵基礎設施條例生效"], ["mo", "漏洞管理技術規範生效"]]], ["2027", [["sg", "MAS：12 月 31 日前制定遷移計劃；關鍵資訊基礎設施擁有者、本地系統重要性銀行及 NETS 須於 6 月 30 日前提交", 1]]], ["2029", [["sg", "MAS：12 月 31 日前完成關鍵資訊基礎設施系統遷移", 1]]], ["2030", [["hk", "金管局目標：業界評分達 10 分"], ["sg", "MAS：完成關鍵系統遷移", 1]]], ["2031", [["sg", "CSA：關鍵資訊基礎設施擁有者完成遷移"]]], ["2034", [["sg", "MAS：完成所有其餘系統遷移", 1]]], ["2035", [["sg", "CSA：鼓勵其他受影響機構完成遷移"]]]], "tagline": "孔明在赤壁之戰前，先讀懂了風。我們在量子之戰前，先讀懂你的密碼。", "s.h": "量子過渡的五條妙計", "s.p": "每項服務都以孔明的一條計策命名，並連結到學院中講解背後原理的課程。", "s.idea": "背後的原理", "services": [{"t": "隆中評估", "b": "六星期內看清自身處境", "d": "固定收費的評估，最終交付一份董事會可批核的遷移計劃。", "i": ["盤點應用程式、PKI、HSM、VPN 及供應商的密碼資產", "評分對應金管局量子準備度指數或 CSA 量子準備度指數", "按資料須保密的年期排列系統優先次序", "董事會文件及按季路線圖"]}, {"t": "八陣遷移", "b": "轉用新演算法，支付系統照常運作", "d": "由第一個混合模式試點到最後一張憑證，全程工程支援。", "i": ["在 TLS 及 VPN 試行混合 ML-KEM 金鑰交換", "規劃 PKI 與 HSM 升級", "上線前進行效能及互通性測試", "新系統內建密碼敏捷性，下次更換更容易"]}, {"t": "七擒測試", "b": "搶在攻擊者之前找出漏洞", "d": "滲透測試與紅隊演練，反覆進行，直至修補穩固。", "i": ["網頁、流動應用及雲端的滲透測試", "紅隊及紫隊演練", "每次修補後重新測試", "分別寫給工程師與董事會的報告"]}, {"t": "錦囊應變", "b": "事故發生前，答案已經封好", "d": "事故應變手冊與支援合約。每份計劃都在對的時刻才拆開。", "i": ["勒索軟件、資料外洩及金鑰洩露的應變手冊", "與管理層進行桌面演練", "按港澳關鍵基礎設施規例進行通報演練", "預留時數的應變支援合約"]}, {"t": "草船誘敵", "b": "從每一次攻擊中學習", "d": "以誘餌及蜜標，將惡意流量化為情報。", "i": ["在生產環境以外部署蜜罐", "在程式碼、雲端及目錄中放置蜜標", "根據截獲樣本撰寫威脅情報報告", "警報直接送到你的保安運作中心"]}], "h.h": "三顧茅廬", "h.p": "劉備三顧茅廬，孔明才畫出隆中對。我們的合作亦按同樣次序進行。", "visits": [["一顧", "準備度簡報", "45 分鐘，免費，並受保密協議保障。我們會確定哪個監管時間表適用於你，並指出三個風險最高的系統。"], ["二顧", "隆中評估", "六星期，固定收費。完成盤點、評分、排好優先次序的遷移計劃及董事會文件。"], ["三顧", "出師", "我們陪你完成遷移：試點、供應商審視、測試，以及每季重新評分。"]], "t.h": "與我們培育的人才一同建立", "t.p": "每項合作均由資深顧問帶領。合資格的實習成員在督導下工作，並受貴機構的保密協議約束。", "talent": [["學院", "八條計策、五個階段及四座實驗室，借三國故事講授量子科學與網絡安全。可用於向董事會簡報，或培訓工程團隊。", "前往學院"], ["實習計劃", "為準備投身量子計算、密碼學及網絡安全的人才，提供參與真實項目的有薪實習。", "了解實習計劃"]], "f.h": "董事會與資訊保安總監常問的問題", "faq": [["量子電腦何時會破解現今的加密？", "目前沒有公認的日期。新加坡金融管理局指出，各方普遍認為具密碼破解能力的量子電腦可能在未來數年內出現。對需要長期保密的資料而言，風險已經存在，因為攻擊者可以現在截取，日後再解密。"], ["我們是金管局認可機構。量子準備度指數評估甚麼？", "四個範疇：認知、規劃、試行及實務準備。業界於 2026 年 7 月的起步分數為 2.3 分（滿分 10 分），金管局目標是 2030 年前達到 10 分。與科大合作的工具包闡明了管治、盤點、優先次序及供應商方面的良好做法。我們的評估按同一架構匯報。"], ["MAS 的日期已經定案嗎？", "尚未。日期來自諮詢文件 P019-2026，諮詢已於 2026 年 11 月 23 日結束，MAS 表示時間表或會修訂。我們按建議日期規劃，並在正式通告發出後調整。"], ["澳門沒有量子相關規定，為何現在就要開始？", "當地的銀行及博彩企業已屬第 13/2019 號法律下的關鍵基礎設施。不少機構隸屬於在香港或新加坡設有實體的集團，而你所依賴的供應商亦正按這些時間表遷移。一次盤點，可同時應付三地。"], ["你們會服務香港、新加坡及澳門以外的客戶嗎？", "會。我們服務漢字文化圈其他地區、北美及歐洲的客戶，通常以遙距方式進行，按需要出差。每份計劃都按你須遵從的每個監管機構的規則制定；受多個監管機構規管的集團只需一次盤點，再按各監管要求分支規劃。"], ["是否需要一次過更換所有密碼技術？", "不需要。遷移分階段進行，先處理面向互聯網的系統及須長期保存的資料。不少系統會先以混合模式，同時運行傳統與後量子演算法。"], ["你們會遷移至哪些演算法？", "美國國家標準與技術研究院（NIST）於 2024 年公布的標準：用於金鑰建立的 ML-KEM（FIPS 203），以及用於簽署的 ML-DSA（FIPS 204）和 SLH-DSA（FIPS 205），並按監管機構的建議作調整。"], ["實習成員會接觸我們的資料嗎？", "只在你書面批准的情況下。實習成員與正式員工簽署相同的保密協議，由指定的資深顧問督導；除非你的團隊為特定工作授權，否則不會接觸生產系統。"], ["隆中評估收費多少？", "固定收費，在免費簡報之後、開展任何工作之前以書面報價。費用視乎涉及的業務單位及系統數量。"], ["我們需要量子密鑰分發嗎？", "通常不需要。後量子密碼學可在現有網絡及硬件上運行，這亦是監管機構的焦點。只有個別鏈路確有需要時，我們才會評估量子密鑰分發。"]], "b.h": "由一次對話開始", "b.p": "45 分鐘後，你會知道哪個監管時間表適用於你，以及應先處理哪三個系統。", "rr": ["免費，不附帶任何義務", "展開任何調查前先簽保密協議", "開展工作前先議定固定收費"], "f.name": "姓名", "f.email": "工作電郵", "f.org": "機構", "f.city": "城市", "f.sector": "行業", "f.driver": "促成這次查詢的原因", "f.lang": "首選語言", "f.note": "我們會以電郵確認。", "f.sending": "傳送中", "f.done": "謝謝你，{name}。我們已收到你的提交，並已發送確認電郵。", "err.req": "請填寫{field}。", "err.email": "請輸入有效的電郵地址，例如 name@bank.com。", "cities": ["香港", "新加坡", "澳門", "其他地區"], "sectors": ["銀行或保險", "支付或儲值支付", "關鍵基礎設 Object.assign(I.vi,{
"t.h":"Được xây dựng cùng những người chúng tôi đào tạo",
"t.p":"Các chuyên gia cấp cao dẫn dắt mọi dự án. Thành viên co-op đủ điều kiện tham gia dưới sự giám sát và theo NDA của bạn.",
"talent":[["Học viện","Tám mưu kế, năm cấp độ và bốn phòng thí nghiệm dạy khoa học lượng tử và an ninh mạng qua câu chuyện Tam Quốc. Dùng để báo cáo hội đồng quản trị hoặc đào tạo kỹ sư.","Vào Học viện"],["Chương trình Co-op","Kỳ làm việc có trả lương trong các dự án thực tế dành cho người theo đuổi điện toán lượng tử, mật mã và an ninh mạng.","Xem Co-op"]],
"f.h":"Câu hỏi hội đồng quản trị và CISO thường hỏi",
"faq":[
["Khi nào máy tính lượng tử sẽ phá được mã hóa hiện nay?","Chưa ai có ngày thống nhất. MAS mô tả sự đồng thuận mạnh rằng một máy tính lượng tử đủ sức phá mật mã có thể xuất hiện trong vài năm tới. Rủi ro đã hiện hữu với dữ liệu cần giữ bí mật lâu dài, vì kẻ tấn công có thể ghi lại ngay bây giờ và giải mã sau."],
["Chúng tôi là tổ chức được HKMA cấp phép. Chỉ số Sẵn sàng Lượng tử xem xét điều gì?","Bốn lĩnh vực: nhận thức, lập kế hoạch, thí điểm và sẵn sàng thực tiễn. Ngành bắt đầu ở mức 2,3 trên 10 vào tháng 7/2026, và HKMA đặt mục tiêu 10 vào năm 2030. Bộ công cụ PQC cùng HKUST nêu rõ thế nào là tốt về quản trị, kiểm kê, ưu tiên hóa và nhà cung cấp. Đánh giá của chúng tôi báo cáo theo cùng cấu trúc đó."],
["Các mốc của MAS đã chốt chưa?","Chưa. Chúng đến từ Tham vấn P019-2026, đã kết thúc ngày 23/11/2026, và MAS cho biết mốc có thể được điều chỉnh. Chúng tôi lập kế hoạch theo mốc đề xuất và điều chỉnh khi thông tư chính thức được ban hành."],
["Ma Cao chưa có quy định lượng tử. Vì sao nên bắt đầu ngay?","Các ngân hàng và sòng bạc ở đó đã là hạ tầng trọng yếu theo Luật 13/2019. Nhiều đơn vị thuộc tập đoàn có chi nhánh tại Hồng Kông hoặc Singapore, và các nhà cung cấp bạn dựa vào đang chuyển đổi theo những mốc đó. Một bản kiểm kê làm một lần có thể phục vụ cả ba thành phố."],
["Chúng tôi có phải thay toàn bộ mật mã cùng lúc không?","Không. Việc chuyển đổi diễn ra theo giai đoạn, bắt đầu với các hệ thống hướng Internet và dữ liệu lưu giữ lâu dài. Nhiều hệ thống trước hết chạy song song thuật toán cổ điển và hậu lượng tử ở chế độ lai."],
["Bạn chuyển sang thuật toán nào?","Các tiêu chuẩn NIST công bố năm 2024: ML-KEM (FIPS 203) để thiết lập khóa, ML-DSA (FIPS 204) và SLH-DSA (FIPS 205) cho chữ ký, điều chỉnh theo khuyến nghị của cơ quan quản lý của bạn."],
["Thành viên co-op có xem được dữ liệu của chúng tôi không?","Chỉ khi bạn chấp thuận bằng văn bản. Thành viên co-op ký cùng NDA như nhân viên, làm việc dưới sự hướng dẫn của một chuyên gia cấp cao được chỉ định, và không chạm vào hệ thống sản xuất trừ khi nhóm của bạn cấp quyền cho một tác vụ xác định."],
["Đánh giá Long Trung có chi phí bao nhiêu?","Phí cố định, được báo giá bằng văn bản sau buổi briefing miễn phí và trước khi bắt đầu công việc. Phí phụ thuộc vào số đơn vị kinh doanh và hệ thống trong phạm vi."],

    c.fillStyle=mist; c.fillRect(0,SH*(L.y-.02),SW,SH*.1);
  });
  var n=Math.round(Math.min(130,SW*SH/9000));
  parts=[];
  for(var i=0;i<n;i++) parts.push({x:rand(0,SW),y:rand(0,SH),vx:rand(-.08,.08),vy:rand(-.18,-.03),r:rand(.6,1.8),gold:Math.random()<.22,ph:rand(0,6.3)});
}
function drawSky(t){
  sctx.setTransform(1,0,0,1,0,0);
  sctx.drawImage(bgLayer,0,0);
  sctx.setTransform(DPR,0,0,DPR,0,0);
  var i,j,p,q,dx,dy,d2,max=95*95;
  sctx.lineWidth=.6;
  for(i=0;i<parts.length;i++){
    p=parts[i];
    for(j=i+1;j<parts.length;j++){
      q=parts[j]; dx=p.x-q.x; dy=p.y-q.y; d2=dx*dx+dy*dy;

    }
  }
  for(i=0;i<parts.length;i++){
    p=parts[i];
    var a=.45+.4*Math.sin(t*.0015+p.ph);

}

/* ---------- bagua oracle ---------- */
var bc=$("bagua"),bctx=bc.getContext("2d"),BW=0,BD=1;
var mode="super",chosen=-1,spinUntil=0,spinIdx=0,lastSpin=0;
function sizeBagua(){
  var r=bc.getBoundingClientRect(); if(!r.width) return;
  BD=Math.min(window.devicePixelRatio||1,2); BW=r.width;
  bc.width=BW*BD; bc.height=BW*BD;
}
function drawBagua(t){
  if(!BW||$("v-home").hidden) return;
  var c=bctx,W=BW,cx=W/2,cy=W/2,R=W*.30;
  c.setTransform(BD,0,0,BD,0,0); c.clearRect(0,0,W,W);
  var time=reduce?0:t/1000;
  /* outer rings and 64 hexagram ticks */
  c.strokeStyle="rgba(150,172,226,.22)"; c.lineWidth=1;
  c.beginPath(); c.arc(cx,cy,R*1.3,0,Math.PI*2); c.stroke();
  c.beginPath(); c.arc(cx,cy,R*.7,0,Math.PI*2); c.stroke();
  for(var k=0;k<64;k++){
    var a=k/64*Math.PI*2+time*.05, r1=R*1.3, r2=R*(k%8===0?1.22:1.26);
    c.strokeStyle=k%8===0?"rgba(240,195,90,.55)":"rgba(150,172,226,.28)";
    c.beginPath(); c.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); c.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2); c.stroke();
  }
  var active=-1;
  if(mode==="spin"){ if(t-lastSpin>70){spinIdx=Math.floor(Math.random()*8);lastSpin=t;} active=spinIdx; if(t>=spinUntil){mode="collapsed";updateReadout();} }
  if(mode==="collapsed") active=chosen;
  /* beams */
  for(var i=0;i<8;i++){
    var ang=-Math.PI/2+i*Math.PI/4, px=cx+Math.cos(ang)*R, py=cy+Math.sin(ang)*R;
    var on=(i===active), sup=(mode==="super");
    var amp=sup?(.5+.35*Math.sin(time*2.2+i*.9)):(on?1:.16);
    if(sup||on){
      var lg=c.createLinearGradient(cx,cy,px,py);
      lg.addColorStop(0,on?"rgba(240,195,90,.0)":"rgba(63,240,216,0)");
      lg.addColorStop(1,on?"rgba(240,195,90,.85)":"rgba(63,240,216,"+(amp*.35)+")");
      c.strokeStyle=lg; c.lineWidth=on?2:1; c.beginPath(); c.moveTo(cx,cy); c.lineTo(px,py); c.stroke();
    }
    /* trigram */
    var bits=TRI[RING[i]].b, col=on?"240,195,90":"63,240,216", L=R*.30, sw=R*.05, gap=R*.085;
    c.save(); c.translate(px,py); c.rotate(ang+Math.PI/2);
    c.shadowColor="rgba("+col+","+(on?.9:.6*amp)+")"; c.shadowBlur=on?18:10*amp;
    c.fillStyle="rgba("+col+","+Math.min(1,amp+.1)+")";
    for(var ln=0;ln<3;ln++){
      var bit=bits.charAt(2-ln), y=(ln-1)*gap - sw/2; /* local +y points to centre: bottom line nearest centre */
      if(bit==="1") c.fillRect(-L/2,y,L,sw);
      else { c.fillRect(-L/2,y,L*.42,sw); c.fillRect(L*.08,y,L*.42,sw); }
    }
    c.restore();
    /* labels */
    var lr=R*1.5, lx=cx+Math.cos(ang)*lr, ly=cy+Math.sin(ang)*lr;
    c.textAlign="center"; c.textBaseline="middle";
    c.fillStyle=on?"#f0c35a":"rgba(236,230,214,"+(sup?.85:.35)+")";
    c.font="900 "+Math.round(W*.037)+"px 'Noto Serif TC', serif";
    c.fillText(RING[i],lx,ly-W*.016);
    var rdg=FIX[lang]?FIX[lang][RING[i]]:(lang==="zh"?SIMP[RING[i]]:null);
    if(rdg){ c.save(); c.textAlign="left"; c.font="600 "+Math.round(W*.02)+"px 'Noto Serif JP','Noto Serif KR','Noto Serif SC',serif"; c.fillStyle=on?"#f0c35a":"rgba(240,195,90,"+(sup?.8:.35)+")"; c.fillText(rdg,lx+W*.024,ly-W*.022); c.restore(); }
    c.font="500 "+Math.round(W*.022)+"px 'JetBrains Mono', monospace";
    c.fillStyle=on?"#f0c35a":"rgba(154,163,191,"+(sup?.9:.4)+")";
    c.fillText("|"+bits+"⟩",lx,ly+W*.022);
  }
  /* nucleus + electron orbits */
  for(var o=0;o<3;o++){
    c.save(); c.translate(cx,cy); c.rotate(o*Math.PI/3+time*.15);
    c.strokeStyle="rgba(63,240,216,.28)"; c.lineWidth=1;
    c.beginPath(); c.ellipse(0,0,R*.55,R*.19,0,0,Math.PI*2); c.stroke();
    var ea=time*(1.4+o*.35)+o*2;
    c.fillStyle="#3ff0d8"; c.shadowColor="rgba(63,240,216,.9)"; c.shadowBlur=10;
    c.beginPath(); c.arc(Math.cos(ea)*R*.55,Math.sin(ea)*R*.19,W*.008,0,Math.PI*2); c.fill();
    c.restore();
  }
  var ng=c.createRadialGradient(cx,cy,0,cx,cy,R*.2);
  ng.addColorStop(0,"rgba(255,236,190,1)"); ng.addColorStop(.35,"rgba(240,195,90,.85)"); ng.addColorStop(1,"rgba(240,195,90,0)");
  c.fillStyle=ng; c.beginPath(); c.arc(cx,cy,R*.2,0,Math.PI*2); c.fill();
}

function p1(){var th=theta.value*Math.PI/180;return Math.pow(Math.sin(th/2),2);}
function setBars(c0,c1){
  var tot=1000,e1=p1();
  $("f0").style.width=(c0/tot*100)+"%"; $("f1").style.width=(c1/tot*100)+"%";
  $("e0").style.left="calc("+((1-e1)*100)+"% - 1px)"; $("e1").style.left="calc("+(e1*100)+"% - 1px)";
  $("v0").textContent=Math.round(c0)+" / "+((1-e1)*100).toFixed(1)+"%";
  $("v1").textContent=Math.round(c1)+" / "+(e1*100).toFixed(1)+"%";
}
function runShots(animate){
  var p=p1(),one=0; for(var i=0;i<1000;i++) if(Math.random()<p) one++;
  counts=[1000-one,one];
  if(!animate||reduce){shown=counts.slice();setBars(counts[0],counts[1]);return;}
  var from=shown.slice(); animStart=performance.now();
  (function step(now){
    var k=Math.min(1,(now-animStart)/650), e=1-Math.pow(1-k,3);
    shown=[from[0]+(counts[0]-from[0])*e,from[1]+(counts[1]-from[1])*e];
    setBars(shown[0],shown[1]); if(k<1) requestAnimationFrame(step);
  })(animStart);
}
theta.addEventListener("input",function(){$("thetaOut").textContent=theta.value+"°";drawBloch(+theta.value);setBars(shown[0],shown[1]);});

function lcFirst(s){return /^[A-Z][a-z]/.test(s)?s.charAt(0).toLowerCase()+s.slice(1):s;}

function setErr(inp,msg){
 var f=inp.closest(".field"),e=f.querySelector(".ferr");
 if(!msg){f.classList.remove("bad");inp.removeAttribute("aria-invalid");if(e)e.remove();return;}
 if(!e){e=document.createElement("span");e.className="ferr";e.id=inp.id+"Err";f.appendChild(e);inp.setAttribute("aria-describedby",e.id);}
 e.textContent=msg;f.classList.add("bad");inp.setAttribute("aria-invalid","true");
}
function checkInput(inp){
 var v=inp.value.trim();
 if(!v) return plain(T("err.req")).replace("{field}",lcFirst(plain(T(inp.getAttribute("data-f")))));
 if(inp.type==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return plain(T("err.email"));
 return "";
}

function setupForm(form){
 var hp=document.createElement("div");hp.setAttribute("aria-hidden","true");hp.style.cssText="position:absolute;left:-9999px;height:0;overflow:hidden";

 Array.prototype.forEach.call(req,function(inp){

  inp.addEventListener("blur",function(){if(inp.value.trim())setErr(inp,checkInput(inp));});
 });
 form.addEventListener("submit",function(e){
  e.preventDefault();
  var first=null;
  Array.prototype.forEach.call(req,function(inp){var m=checkInput(inp);setErr(inp,m);if(m&&!first)first=inp;});
  if(first){first.focus();return;}
  var btn=form.querySelector('button[type="submit"]'),done=form.querySelector(".thanks"),name=form.querySelector('input[name="name"]').value.trim();
  var err=form.querySelector(".form-err"); if(err) err.hidden=true;
  btn.disabled=true;btn.textContent=plain(T("f.sending"))+"…";done.hidden=true;
  function fail(){
   btn.disabled=false;btn.innerHTML=rb(T(btn.getAttribute("data-i")));
   if(!err){err=document.createElement("p");err.className="ferr form-err";err.setAttribute("role","alert");err.style.display="block";err.style.marginTop="12px";form.appendChild(err);}
   err.textContent=(FORM_ERR[lang]||FORM_ERR.en);err.hidden=false;
  }
  var body=new URLSearchParams();
  Array.prototype.forEach.call(form.elements,function(el){if(el.name&&el.type!=="submit")body.append(el.name,el.value);});
  body.append("form",form.id); body.append("uiLang",lang); body.append("page",location.href);
  fetch(FORM_ENDPOINT,{method:"POST",body:body})
   .then(function(r){return r.json();})
   .then(function(j){
     if(!j||!j.ok){fail();return;}
     btn.disabled=false;btn.innerHTML=rb(T(btn.getAttribute("data-i")));done.setAttribute("data-name",name);showDone(done);
   })
   .catch(fail);
 });
}

/* ---------- desktop submenus: hover or the caret opens, Escape closes ---------- */
var canHover=!!(window.matchMedia&&window.matchMedia("(hover: hover) and (pointer: fine)").matches);
function ddParts(dd){return {m:dd.querySelector(".dd-m"),t:dd.querySelector(".dd-t")};}
function ddOpen(dd){
 each(".dd",function(o){if(o!==dd)ddClose(o);});
 var p=ddParts(dd); clearTimeout(dd._t);
 if(p.t.getAttribute("aria-expanded")==="true") return;
 p.m.hidden=false; p.t.setAttribute("aria-expanded","true");
 requestAnimationFrame(function(){requestAnimationFrame(function(){if(p.t.getAttribute("aria-expanded")==="true")p.m.classList.add("open");});});
}
function ddClose(dd){
 var p=ddParts(dd);
 if(p.t.getAttribute("aria-expanded")!=="true") return;
 p.m.classList.remove("open"); p.t.setAttribute("aria-expanded","false");
 clearTimeout(dd._t); dd._t=setTimeout(function(){if(p.t.getAttribute("aria-expanded")!=="true")p.m.hidden=true;},300);
}
function closeDd(){each(".dd",ddClose);}
each(".dd",function(dd){
 var p=ddParts(dd);
 p.t.addEventListener("click",function(){if(p.t.getAttribute("aria-expanded")==="true")ddClose(dd);else ddOpen(dd);});
 if(canHover){
  dd.addEventListener("mouseenter",function(){clearTimeout(dd._h);ddOpen(dd);});
  dd.addEventListener("mouseleave",function(){clearTimeout(dd._h);dd._h=setTimeout(function(){ddClose(dd);},140);});
 }
 dd.addEventListener("focusout",function(e){if(!dd.contains(e.relatedTarget))ddClose(dd);});
 dd.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&p.t.getAttribute("aria-expanded")==="true"){ddClose(dd);p.t.focus();}
  else if(e.key==="ArrowDown"&&e.target===p.t){e.preventDefault();ddOpen(dd);setTimeout(function(){var x=p.m.querySelector("a");if(x)x.focus();},40);}
 });
});
